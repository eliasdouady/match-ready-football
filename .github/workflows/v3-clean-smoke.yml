name: V3 clean smoke test

on:
  push:
    branches:
      - v3-clean
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: |
          python -m py_compile dashboard/app.py
          python -m py_compile src/skillcorner_reference.py

      - name: Validate real-data benchmark
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/real/skillcorner_position_benchmarks.csv")
          assert set(df["position"]) == {"CB", "FB", "CM", "W", "ST"}
          assert not df.isna().any().any()
          assert (df["n_players"] >= 1).all()
          assert (df["total_matches"] >= 1).all()
          print(df[["position", "n_players", "total_matches"]].to_string(index=False))
          PY

      - name: Start Streamlit
        run: |
          streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $APP_PID || true
          exit 1
