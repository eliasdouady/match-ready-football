name: Build SkillCorner tracking variability

on:
  push:
    branches:
      - tracking-variability-v1
    paths:
      - "src/skillcorner_tracking_variability.py"
      - ".github/workflows/build-tracking-variability.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/skillcorner_tracking_variability.py"
      - ".github/workflows/build-tracking-variability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Match Ready
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas numpy

      - name: Checkout SkillCorner Open Data without LFS smudge
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git clone --depth 1 https://github.com/SkillCorner/opendata.git external/skillcorner
          git -C external/skillcorner lfs install --local
          git -C external/skillcorner lfs pull --include="data/matches/*/*_tracking_extrapolated.jsonl"

      - name: Build match-to-match variability tables
        run: |
          python src/skillcorner_tracking_variability.py --source-root external/skillcorner

      - name: Show generated summary
        run: |
          python - <<'PY'
          import pandas as pd
          obs = pd.read_csv("data/real/skillcorner_tracking_player_matches.csv")
          var = pd.read_csv("data/real/skillcorner_tracking_variability.csv")
          print(f"Player-match observations: {len(obs)}")
          print(f"Matches represented: {obs.match_id.nunique()}")
          print(var.to_string(index=False))
          PY

      - name: Upload generated summaries
        uses: actions/upload-artifact@v4
        with:
          name: skillcorner-tracking-variability
          path: |
            data/real/skillcorner_tracking_player_matches.csv
            data/real/skillcorner_tracking_variability.csv

      - name: Commit generated summaries on tracking branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real/skillcorner_tracking_player_matches.csv data/real/skillcorner_tracking_variability.csv
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add SkillCorner match-to-match tracking summaries"
            git push origin HEAD:tracking-variability-v1
          fi
